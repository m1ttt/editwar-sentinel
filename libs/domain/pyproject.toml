[project]
name = "editwar-domain"
version = "1.1.1"
description = "Shared domain model, topic names and settings for EditWar Sentinel."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
telemetry = ["azure-monitor-opentelemetry>=1.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/editwar_domain"]
