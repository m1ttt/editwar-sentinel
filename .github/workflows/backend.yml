# Backend pipeline: quality -> unit tests -> build images -> deploy dev -> (approval) -> deploy prod.
# GitFlow: PRs to develop/main run quality and tests. A push to develop deploys dev.
# A push to main deploys dev and then prod after a reviewer approves the "prod" environment.
name: backend

on:
  pull_request:
    branches: [develop, main]
    paths: &backend-paths
      - libs/**
      - services/**
      - pyproject.toml
      - uv.lock
      - deploy/k8s/**
      - .github/workflows/backend.yml
  push:
    branches: [develop, main]
    # Release tags publish the X.Y.Z and X.Y images (path filters are not checked for tags).
    tags: ["v*.*.*"]
    paths: *backend-paths
  workflow_dispatch:

# Minimum rights by default. Jobs that need more ask for them.
permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: m1ttt

jobs:
  quality:
    name: Calidad (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # --frozen: fail if uv.lock does not match pyproject.toml.
      - name: Install dependencies
        run: uv sync --all-packages --all-extras --frozen
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy per package
        run: |
          for dir in libs/domain services/ingestor services/detector services/api; do
            echo "::group::mypy $dir"
            uv run mypy "$dir/src"
            echo "::endgroup::"
          done

  test:
    name: Pruebas unitarias (${{ matrix.package }})
    runs-on: ubuntu-latest
    # Needed to publish the test report as a check run and as a PR comment.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: domain
            dir: libs/domain
            module: editwar_domain
          - package: ingestor
            dir: services/ingestor
            module: editwar_ingestor
          - package: detector
            dir: services/detector
            module: editwar_detector
          - package: api
            dir: services/api
            module: editwar_api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-packages --all-extras --frozen
      - name: pytest with coverage (minimum 80 %)
        env:
          DIR: ${{ matrix.dir }}
          MODULE: ${{ matrix.module }}
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir -p reports
          uv run pytest "$DIR/tests" \
            --cov="$MODULE" \
            --cov-report=term-missing \
            --cov-report="xml:reports/coverage-$PACKAGE.xml" \
            --cov-fail-under=80 \
            --junitxml="reports/junit-$PACKAGE.xml"
      - name: Coverage table in the run summary
        if: ${{ !cancelled() }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          {
            echo "### Cobertura: $PACKAGE"
            uv run coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.package }}
          path: reports/
      # Shows passed/failed tests as a check, in the run summary and as a PR comment.
      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Reporte de pruebas (${{ matrix.package }})
          files: reports/junit-${{ matrix.package }}.xml

  build:
    name: Build y push (${{ matrix.service }})
    needs: [quality, test]
    # Set the repository variable CD_ENABLED=true once the Docker Hub secrets and the
    # Azure variables exist. Until then the pipeline stops after the tests, and the
    # deploy jobs (which need this job) are skipped too.
    if: github.event_name == 'push' && vars.CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ingestor, detector, api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Tags: sha-<7 chars> always, edge on develop, latest on main, X.Y.Z and X.Y on tags vX.Y.Z.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/editwar-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=false
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in GitHub Actions, one scope per image.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-dev:
    name: Deploy dev
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # The environment name is part of the OIDC subject (repo:m1ttt/editwar-sentinel:environment:dev).
    environment:
      name: dev
      url: http://${{ vars.DEV_HOST }}
    # Backend and frontend share this group, so two deploys never run at the same time.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # lets azure/login get an OIDC token (no stored password)
    env:
      NAMESPACE: editwar-dev
      OVERLAY: overlays/dev
      HOST: ${{ vars.DEV_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
      - name: Prepare overlay for this commit
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # Working copy: the repo files stay untouched.
          cp -r deploy/k8s "$RUNNER_TEMP/k8s"
          cd "$RUNNER_TEMP/k8s/$OVERLAY"
          for svc in ingestor detector api; do
            kustomize edit set image "m1ttt/editwar-$svc=m1ttt/editwar-$svc:$TAG"
          done
          # Keep the dashboard image that the frontend pipeline deployed.
          CURRENT=$(kubectl -n "$NAMESPACE" get deployment dashboard \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
          if [ -n "$CURRENT" ]; then
            kustomize edit set image "m1ttt/editwar-dashboard=$CURRENT"
          fi
          # /api/version returns this value, so the smoke test proves which commit runs.
          kustomize edit set configmap editwar-config --from-literal="SERVICE_VERSION=$TAG"
          # Real host from the repository variable (replaces the placeholder host).
          kustomize edit add patch --kind Ingress --name editwar \
            --patch "[{\"op\":\"replace\",\"path\":\"/spec/rules/0/host\",\"value\":\"$HOST\"}]"
          kustomize build . | grep -E "image:|host:|SERVICE_VERSION"
      - name: Apply
        run: |
          # A Job cannot be updated in place: delete the old one so apply creates it again.
          kubectl -n "$NAMESPACE" delete job kafka-topics --ignore-not-found
          kubectl apply -k "$RUNNER_TEMP/k8s/$OVERLAY"
      - name: Wait for Kafka topics
        run: kubectl -n "$NAMESPACE" wait --for=condition=complete job/kafka-topics --timeout=300s
      # Only the backend Deployments. The dashboard image belongs to the frontend pipeline.
      - name: Wait for backend rollouts
        run: |
          for d in api detector ingestor; do
            kubectl -n "$NAMESPACE" rollout status "deployment/$d" --timeout=300s
          done
      - name: Smoke test (/api/version must report this commit)
        run: |
          for i in $(seq 1 30); do
            BODY=$(curl -fsS --max-time 5 "http://$HOST/api/version" || true)
            echo "Attempt $i: $BODY"
            if echo "$BODY" | grep -q "$TAG"; then
              echo "OK: $HOST runs $TAG"
              exit 0
            fi
            sleep 10
          done
          echo "::error::http://$HOST/api/version does not report $TAG"
          exit 1

  deploy-prod:
    name: Deploy prod
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Required reviewers are set on the GitHub environment "prod". The job waits for approval.
    environment:
      name: prod
      url: http://${{ vars.PROD_HOST }}
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      NAMESPACE: editwar-prod
      OVERLAY: overlays/prod
      HOST: ${{ vars.PROD_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
      - name: Prepare overlay for this commit
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          cp -r deploy/k8s "$RUNNER_TEMP/k8s"
          cd "$RUNNER_TEMP/k8s/$OVERLAY"
          for svc in ingestor detector api; do
            kustomize edit set image "m1ttt/editwar-$svc=m1ttt/editwar-$svc:$TAG"
          done
          CURRENT=$(kubectl -n "$NAMESPACE" get deployment dashboard \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
          if [ -n "$CURRENT" ]; then
            kustomize edit set image "m1ttt/editwar-dashboard=$CURRENT"
          fi
          kustomize edit set configmap editwar-config --from-literal="SERVICE_VERSION=$TAG"
          kustomize edit add patch --kind Ingress --name editwar \
            --patch "[{\"op\":\"replace\",\"path\":\"/spec/rules/0/host\",\"value\":\"$HOST\"}]"
          kustomize build . | grep -E "image:|host:|SERVICE_VERSION"
      - name: Apply
        run: |
          kubectl -n "$NAMESPACE" delete job kafka-topics --ignore-not-found
          kubectl apply -k "$RUNNER_TEMP/k8s/$OVERLAY"
      - name: Wait for Kafka topics
        run: kubectl -n "$NAMESPACE" wait --for=condition=complete job/kafka-topics --timeout=300s
      # Only the backend Deployments. The dashboard image belongs to the frontend pipeline.
      - name: Wait for backend rollouts
        run: |
          for d in api detector ingestor; do
            kubectl -n "$NAMESPACE" rollout status "deployment/$d" --timeout=300s
          done
      - name: Smoke test (/api/version must report this commit)
        run: |
          for i in $(seq 1 30); do
            BODY=$(curl -fsS --max-time 5 "http://$HOST/api/version" || true)
            echo "Attempt $i: $BODY"
            if echo "$BODY" | grep -q "$TAG"; then
              echo "OK: $HOST runs $TAG"
              exit 0
            fi
            sleep 10
          done
          echo "::error::http://$HOST/api/version does not report $TAG"
          exit 1
