# Terraform pipeline for infra/terraform.
# Pull request: format check and validate, without Azure credentials.
# Manual run (workflow_dispatch): plan, and apply only after approval on "infra-approval".
name: infra

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/infra.yml
  workflow_dispatch:
    inputs:
      action:
        description: "plan = show the changes. apply = plan and then apply after approval."
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

defaults:
  run:
    working-directory: infra/terraform

jobs:
  validate:
    name: fmt + validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt -check
        run: terraform fmt -check -recursive
      # -backend=false: no state and no Azure login needed for validate.
      - name: terraform init
        run: terraform init -backend=false
      - name: terraform validate
        run: terraform validate

  plan:
    name: Plan
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # OIDC subject repo:m1ttt/editwar-sentinel:environment:infra-plan (no reviewers needed).
    environment: infra-plan
    permissions:
      contents: read
      id-token: write
    env:
      # The azurerm provider and backend log in with the GitHub OIDC token.
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.INFRA_AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.INFRA_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      # Remote state in Azure Storage. The names come from repository variables.
      - name: terraform init
        env:
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
        run: |
          terraform init \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=editwar-sentinel.tfstate"
      # The reviewer reads this log before approving "infra-approval".
      # The plan file is not uploaded: it holds secrets (state values) in clear text.
      - name: terraform plan
        run: terraform plan

  apply:
    name: Apply
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    # Required reviewers on "infra-approval" make this job wait for a human.
    environment: infra-approval
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.INFRA_AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.INFRA_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - name: terraform init
        env:
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
        run: |
          terraform init \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=editwar-sentinel.tfstate"
      # Apply plans again against the current state. The approval gate is the human check.
      - name: terraform apply
        run: terraform apply -auto-approve
