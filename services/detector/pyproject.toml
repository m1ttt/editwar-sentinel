[project]
name = "editwar-detector"
version = "0.1.0"
description = "Evaluates detection rules over sliding windows and emits reverts and alerts."
requires-python = ">=3.12"
dependencies = [
    "editwar-domain[telemetry]",
    "aiokafka>=0.11",
    "httpx>=0.27",
]

[project.scripts]
editwar-detector = "editwar_detector.main:main"

[tool.uv.sources]
editwar-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/editwar_detector"]
