[project]
name = "editwar-ingestor"
version = "1.0.0"
description = "Reads the Wikimedia recentchange stream and publishes edits to Kafka."
requires-python = ">=3.12"
dependencies = [
    "editwar-domain[telemetry]",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "aiokafka>=0.11",
]

[project.scripts]
editwar-ingestor = "editwar_ingestor.main:main"

[tool.uv.sources]
editwar-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/editwar_ingestor"]
