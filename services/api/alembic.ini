# Used only to run Alembic by hand from services/api, for example:
#   DATABASE_URL=postgresql+asyncpg://editwar:editwar@localhost/editwar alembic upgrade head
#   alembic revision -m "add column"
# The api itself runs the migrations at startup (editwar_api.db.run_migrations).
[alembic]
script_location = alembic
prepend_sys_path = .
