# REST and WebSocket API (FastAPI on port 8000).
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  # No "replicas" field: the HorizontalPodAutoscaler below owns the replica count.
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # contract with services/api/Dockerfile
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: m1ttt/editwar-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          # Shared settings, then the optional telemetry Secret (absent in k3d).
          envFrom:
            - configMapRef:
                name: editwar-config
            - secretRef:
                name: editwar-telemetry
                optional: true
          env:
            # All replicas share the group "api-alerts", so each alert is stored once.
            # The live feed consumer has no group, so every replica sees every message.
            - name: KAFKA_GROUP_ID
              value: api
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: editwar-postgres
                  key: DATABASE_URL
          # Every replica reads the whole live feed (about 45m CPU at rest), so the
          # request must stay above that or the HPA scales to the maximum for nothing.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Liveness: the process answers. Readiness: it can reach Kafka and PostgreSQL.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
# CPU-based autoscaling, the same pattern as the course HPA lab.
# Needs metrics-server (included in k3s and AKS).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  labels:
    app: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
