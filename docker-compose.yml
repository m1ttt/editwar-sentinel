# Local development and demo fallback. Start with "make compose-up", open http://localhost:8080.
# Kafka is also reachable from the laptop at localhost:29092.

# Settings shared by the three Python services (YAML anchor, merged below with "<<").
x-common-env: &common-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_ENABLED: "true"
  ENVIRONMENT: local
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SERVICE_VERSION: local
  # Empty = telemetry off. Export the variable in the shell to send data to Application Insights.
  APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}

services:
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two client listeners: INTERNAL for containers, HOST for tools on the laptop.
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # One-shot container: creates the topics and exits. Safe to run again (--if-not-exists).
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: -Xmx128m
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        for spec in wiki.edits:6 wiki.reverts:3 wiki.alerts:1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$${spec%%:*}" --partitions "$${spec##*:}" --replication-factor 1 \
            --config retention.ms=86400000
        done
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: editwar
      POSTGRES_PASSWORD: editwar # local only
      POSTGRES_DB: editwar
    # Host port for psql on the laptop. Change it if a local PostgreSQL already uses 5432.
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U editwar -d editwar"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: m1ttt/editwar-api:local
    environment:
      <<: *common-env
      KAFKA_GROUP_ID: api
      DATABASE_URL: postgresql+asyncpg://editwar:editwar@postgres:5432/editwar
      ENABLE_DEBUG_ENDPOINTS: "true"
      # Allows the Vite dev server (npm run dev) to call the API directly.
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      # The Python image has no curl, so the check uses the standard library.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  detector:
    build:
      context: .
      dockerfile: services/detector/Dockerfile
    image: m1ttt/editwar-detector:local
    environment:
      <<: *common-env
      KAFKA_GROUP_ID: detector
      API_URL: http://api:8000
      RULES_REFRESH_SECONDS: 30
      HEALTH_PORT: 8081
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  ingestor:
    build:
      context: .
      dockerfile: services/ingestor/Dockerfile
    image: m1ttt/editwar-ingestor:local
    environment:
      <<: *common-env
      # sse = live Wikimedia stream. replay = recorded file inside the image (offline demo).
      # Example: EVENT_SOURCE=replay docker compose up
      EVENT_SOURCE: ${EVENT_SOURCE:-sse}
      WIKIMEDIA_STREAM_URL: https://stream.wikimedia.org/v2/stream/recentchange
      REPLAY_PATH: /data/replay.jsonl
      REPLAY_SPEED: ${REPLAY_SPEED:-1.0}
      WIKIS: ${WIKIS:-}
      HEALTH_PORT: 8081
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  dashboard:
    build:
      context: ./dashboard
    image: m1ttt/editwar-dashboard:local
    environment:
      API_UPSTREAM: http://api:8000
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
